
name: Build Jack's Board Optimizer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Jacks_Board_Optimizer_Android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          mkdir android-project
          unzip Jacks_Board_Optimizer_Android.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Jacks-Board-Optimizer-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
